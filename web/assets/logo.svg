<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- Clean geometric Cortex logo in Google Antigravity style -->
  <g transform="translate(4, 6)">
    <!-- Connected Graph Nodes -->
    <path d="M6 14L16 6L26 14L20 24L8 24Z" stroke="#1a73e8" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0.4"/>
    <line x1="16" y1="6" x2="16" y2="16" stroke="#1a73e8" stroke-width="1.8"/>
    <line x1="6" y1="14" x2="16" y2="16" stroke="#1a73e8" stroke-width="1.8"/>
    <line x1="26" y1="14" x2="16" y2="16" stroke="#1a73e8" stroke-width="1.8"/>
    <line x1="8" y1="24" x2="16" y2="16" stroke="#1a73e8" stroke-width="1.8"/>
    <line x1="20" y1="24" x2="16" y2="16" stroke="#1a73e8" stroke-width="1.8"/>
    
    <!-- Central Node -->
    <circle cx="16" cy="16" r="3.5" fill="#1a73e8"/>
    <!-- Peripheral Nodes -->
    <circle cx="16" cy="6" r="2.2" fill="#121317"/>
    <circle cx="6" cy="14" r="2.2" fill="#121317"/>
    <circle cx="26" cy="14" r="2.2" fill="#121317"/>
    <circle cx="8" cy="24" r="2.2" fill="#121317"/>
    <circle cx="20" cy="24" r="2.2" fill="#121317"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="27" font-family="'Google Sans Flex', 'Google Sans', -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.5px" fill="#121317">CORTEX</text>
</svg>
